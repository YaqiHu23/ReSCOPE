name: Tests
on: [push, pull_request]
jobs:
  cpu:
    # Python 3.9 has prebuilt binaries for Ubuntu 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.9'
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-preprocess.txt
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: bash run.sh demo --output-dir /tmp/rescope-demo
