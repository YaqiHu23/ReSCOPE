# All paths are relative to this file. Run ROI selection first.
histology_image: ../data/my_sample/image.btf
# HD aggregation from the preprocessing pipeline writes all four required files here.
single_cell_dir: ../runs/my_sample/cells
roi_results_dir: ../runs/my_sample/results
# One unique gene name per line; use the SAME predefined panel for all budgets/methods.
gene_list: ../data/my_sample/genes.txt
work_dir: ../runs/my_sample/downstream
device: cuda

bleep_repo: ../third_party/BLEEP
istar_repo: ../third_party/istar
bleep_python: ../.venv-bleep/bin/python
istar_python: ../.venv-istar/bin/python

bleep:
  seed: 42
  max_epochs: 20
  batch_size: 128
  num_workers: 4           # Use 0 if multiprocessing is unavailable.
  svd_components: 512
  top_k: 50

istar:
  seed: 20260730
  epochs: 50
  learning_rate: 0.0001
  gene_chunk_size: 256
  # Equal sizes preserve the historical scale ratio; images >8192 px are downscaled.
  pixel_size_raw: 1.0
  pixel_size_target: 1.0
  # null estimates radius from polygon_area_fullres; otherwise set full-resolution pixels.
  radius_raw: null
