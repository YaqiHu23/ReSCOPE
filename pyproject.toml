[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rescope-roi"
version = "1.0.0"
description = "ReSCOPE: independent ROI scorer training and biological-prior selection for 1, 2, and 3 ROIs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9,<3.13"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/YaqiHu23/ReSCOPE"

[project.scripts]
rescope = "rescope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
rescope = ["py.typed"]
